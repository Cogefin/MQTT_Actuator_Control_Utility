<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MQTTメッセージ送信</title>
</head>
<body>
  <h1>MQTTメッセージ送信</h1>
<pre>
ここには，以下の3つの項目の情報が表示されます．
</pre>

<ul>
  <li>MQTTブローカーの情報</li>
  <li>送信するMQTTメッセージのシーケンス</li>
  <li>送信結果</li>
</ul>

<h2>送信前の確認事項</h2>
<p>
  MQTTブローカーのIPアドレス,ポート番号,送信するMQTTのトピックに問題がないかどうかを確認する．
</p>

<h2>送信開始</h2>
<p>ウィンドウを末尾までスクロールし，「MQTT送信」ボタンを押すとメッセージの送信が開始されます．</p>

<h2>結果の表示</h2>
<p>全部のメッセージの送信が終了すると，送信のログが「送信結果」の部分に表示されます．</p>

</body>
</html>
